# Scope rules — which captured apps belong in lending-scope headlines.
# The harvest is keyword-driven (Play search), so it also catches general-purpose
# UPI/wallet/shopping apps and lenders that operate outside the jurisdiction.
# These stay in the warehouse (nothing hidden) but are labelled out_of_scope.
version: 1
lending_keywords: [loan, lend, credit, cash, borrow, udhaar, paisa, emi, finance,
                   microfinance, payday, kredit, instant cash, salary advance]
# Curated by hand, updated 2026-10-26 — add app ids here when a capture is clearly not a
# lending product for this jurisdiction's consumers.
